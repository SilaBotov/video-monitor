name: Video Monitor

on:
  schedule:
    # Каждые 6 часов по UTC (время GitHub Actions всегда UTC).
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: показать отчёт в логе, не отправлять в Telegram'
        type: boolean
        default: false

permissions:
  contents: write

# Два запуска одновременно не должны драться за state.json.
concurrency:
  group: video-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create empty state.json if not exists
        run: |
          if [ ! -f state.json ]; then
            echo '{"seen": []}' > state.json
          fi

      - name: Run monitor script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python monitor.py

      - name: Commit and push updated state.json
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json не изменился — коммит не нужен"
            exit 0
          fi
          git commit -m "chore: update state.json [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push не удался (попытка $attempt), подтягиваю изменения"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "Не удалось запушить state.json"
          exit 1
